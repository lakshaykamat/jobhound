services:
  jobhound:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    image: jobhound:latest
    container_name: jobhound
    restart: always
    init: true
    env_file:
      - packages/server/.env
    environment:
      TZ: UTC
      DATA_DIR: /app/.data
    ports:
      - "8787:8787"
    volumes:
      # Everything persisted (config.json, jobs, cycles, resume, usage) lives here.
      # Override the host path when deploying to a VM so the data outlives the container.
      - ./packages/server/.data:/app/.data
