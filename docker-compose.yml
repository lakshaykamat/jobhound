services:
  jobhound:
    build: .
    image: jobhound:latest
    container_name: jobhound
    restart: always
    init: true
    env_file:
      - .env
    environment:
      TZ: UTC
      DATA_DIR: /app/.data
    ports:
      - "8787:8787"
    volumes:
      - ./config.json:/app/config.json
      - ./.data:/app/.data
