<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jobhound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'JetBrains Mono', 'monospace'],
          },
          colors: {
            ink: {
              50:'#050505',100:'#0d0d0d',200:'#202020',300:'#383838',400:'#787878',
              500:'#a6a6a6',600:'#c7c7c7',700:'#dedede',800:'#efefef',900:'#f8f8f8',
            },
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-full font-sans antialiased text-ink-900">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="flex min-h-screen" id="root"></div>

  <script type="module">
    import { renderShell } from '/render-shell.js';
    const root = document.getElementById('root');
    root.innerHTML = renderShell();

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error(`failed to load ${src}`));
        document.body.appendChild(s);
      });
    }

    await loadScript('/app.js');
    await loadScript('/tailor.js');
  </script>
</body>
</html>
